# Permanent public link for the browser game:
#   https://aryankhotay-ops.github.io/NeonFighter/
# Every push to main runs the test suite, builds the static Phaser frontend with the
# /NeonFighter/ base path, and publishes it to GitHub Pages. Temporary Vercel links expire,
# so this is the stable, always-up-to-date deployment.
#
# Online Play needs a long-running Colyseus server, which static hosting cannot provide.
# Set the repository variable VITE_SERVER_URL (Settings -> Secrets and variables -> Actions ->
# Variables) to a permanently hosted HTTPS multiplayer endpoint to enable it. Local Versus,
# Training, menus, and every other mode work without a server.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build web frontend
        env:
          VITE_BASE_PATH: /NeonFighter/
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: pnpm --filter @neon-rivals/web build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
